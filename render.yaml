services:
  - type: web
    name: atlibrary-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: LOAN_DAYS
        value: "14"
      - key: FINE_PER_DAY
        value: "10"
      - key: MAX_ACTIVE_BORROWS
        value: "3"
